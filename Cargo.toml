[package]
name = "slowcatch"
version = "0.1.3"
edition = "2024"
license = "GPL-3.0-or-later"
description = "High-performance local developer tool that catches slow shell paths with safe fast-path hooks for Codex and other agents."
repository = "https://github.com/baitouwuya/slowcatch"
readme = "README.md"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
grep-regex = "0.1.14"
grep-searcher = "0.1.16"
ignore = "0.4.25"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23"
thiserror = "2.0"
toml = "0.8"
tree-sitter = "0.25"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-gdscript = "6.1.0"
tree-sitter-python = "0.25.0"
tree-sitter-powershell = "0.26.4"
tree-sitter-rust = "0.24.2"

[target.'cfg(windows)'.dependencies]
everything-sdk = "0.0.6"

[features]
default = []
live-everything = []
